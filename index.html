<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Keviin - Portafolio Profesional</title>
    <!-- FAVICON REDONDO ROJO DE KEVIIN -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='45' fill='%2308080a'/><circle cx='50' cy='50' r='20' fill='%23ff2a4b'/></svg>">
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;800&family=Outfit:wght@400;600;700;800;900&family=Space+Grotesk:wght@600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>

    <div class="background-effects">
        <div class="grid-overlay"></div>
        <div class="glow-orb orb-1" id="orb1"></div>
        <div class="glow-orb orb-2" id="orb2"></div>
        <div id="particlesContainer" class="particles-container"></div>
    </div>

    <!-- REPRODUCTOR DE AUDIO -->
    <audio id="bgMusic" loop preload="auto"></audio>

    <nav class="navbar">
        <div class="logo">
            <span class="k-fancy-letter">K</span>
            <span class="logo-accent" id="logoText">eviin</span>
            <span class="status-dot"></span>
        </div>
        
        <div class="nav-links" id="navigationMenu"></div>
        
        <div class="navbar-right-group">
            <!-- GLOBITO UNIFICADO (VISITAS Y MÚSICA EN UN SOLO CONTENEDOR CONTINUO) -->
            <div class="unified-music-pill" id="musicPlayerBtn" onclick="toggleMusic()">
                <div class="visitor-counter-part">
                    <i class="fas fa-eye"></i>
                    <span id="visitorCounterNum" class="visitor-num">1,430</span>
                </div>
                <div class="pill-divider-line"></div>
                <div class="music-player-part">
                    <div class="music-bars" id="musicBars">
                        <span></span><span></span><span></span>
                    </div>
                    <div class="music-info">
                        <span class="song-title" id="songTitleDisplay">Música de fondo</span>
                    </div>
                </div>
                <div class="music-tooltip" id="musicTooltip">Click para reproducir / pausar</div>
            </div>
        </div>
    </nav>

    <main class="main-container">
        <div id="cardsStage" class="cards-stage"></div>
    </main>

    <div class="toast" id="toastNotification">Copiado al portapapeles</div>

    <script src="js/main.js"></script>
</body>
</html>
