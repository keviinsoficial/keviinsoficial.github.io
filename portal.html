<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Terminal de Control - Keviin</title>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
</head>
<body class="admin-body">
    <div class="admin-container">
        <header class="admin-header">
            <div class="admin-title">
                <i class="fas fa-sliders-h"></i>
                <h2>CONFIGURACIÓN DEL SISTEMA</h2>
            </div>
            <div class="session-badge">
                <span class="status-dot"></span> Sesión: <strong>Keviin (Propietario)</strong>
            </div>
            <a href="index.html" class="btn-exit"><i class="fas fa-sign-out-alt"></i> CERRAR SESIÓN / VER SITIO</a>
        </header>

        <div class="admin-tabs">
            <button class="tab-btn active"><i class="fas fa-music"></i> Música & Reproductor</button>
        </div>

        <div class="admin-card">
            <div class="form-group">
                <label>TÍTULO DE LA CANCIÓN (SE MUESTRA EN LA BARRA SUPERIOR):</label>
                <input type="text" id="music-title-input" placeholder="Ej: Canción de Fondo - Keviin">
            </div>

            <h3 class="section-subtitle"><i class="fas fa-music"></i> CARGAR MÚSICA DE FONDO</h3>

            <div class="music-grid">
                <div class="upload-box" onclick="document.getElementById('local-audio-file').click()">
                    <i class="fas fa-file-audio"></i>
                    <p><strong>Haz click para elegir tu archivo .mp3 local</strong></p>
                    <span id="file-name-display">Ningún archivo seleccionado</span>
                    <input type="file" id="local-audio-file" accept="audio/mp3,audio/*" style="display:none;" onchange="updateFileName(this)">
                </div>

                <div class="url-box">
                    <label>O PEGAR ENLACE / URL DIRECTO DEL ARCHIVO .MP3:</label>
                    <input type="text" id="music-url-input" placeholder="https://ejemplo.com/musica.mp3">
                </div>
            </div>

            <button class="btn-save-all" onclick="saveAdminConfig()">
                <i class="fas fa-save"></i> GUARDAR TODOS LOS CAMBIOS Y ACTUALIZAR MI PORTAFOLIO
            </button>
        </div>
    </div>
    <script src="js/admin.js"></script>
</body>
</html>
