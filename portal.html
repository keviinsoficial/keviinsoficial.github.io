<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Keviin - Panel de Control</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='45' fill='%2308080a'/><circle cx='50' cy='50' r='20' fill='%23ff2a4b'/></svg>">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700&family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { margin:0; padding:0; box-sizing:border-box; font-family:'Plus Jakarta Sans', sans-serif; }
        body { background:#08080a; color:#fff; display:flex; justify-content:center; align-items:center; min-height:100vh; padding:20px; }
        .admin-card { background:rgba(18,18,24,0.95); border:1px solid rgba(255,255,255,0.08); border-radius:20px; width:100%; max-width:800px; padding:30px; box-shadow:0 20px 50px rgba(0,0,0,0.6); }
        .header { display:flex; justify-content:space-between; align-items:center; margin-bottom:25px; border-bottom:1px solid rgba(255,255,255,0.08); padding-bottom:15px; }
        .header h1 { font-family:'Outfit', sans-serif; font-size:24px; color:#ff2a4b; }
        .form-group { margin-bottom:18px; }
        label { display:block; font-size:13px; color:#a0a0b0; margin-bottom:6px; font-weight:600; }
        input[type="text"], input[type="file"], textarea { width:100%; background:rgba(255,255,255,0.04); border:1px solid rgba(255,255,255,0.1); padding:12px; border-radius:10px; color:#fff; font-size:14px; outline:none; }
        input[type="text"]:focus, textarea:focus { border-color:#ff2a4b; }
        .btn-save { background:#ff2a4b; color:#fff; border:none; padding:12px 24px; border-radius:10px; font-weight:700; cursor:pointer; transition:0.3s ease; }
        .btn-save:hover { background:#e01f3f; transform:translateY(-2px); }
        .upload-box { background:rgba(255,42,75,0.05); border:1px dashed #ff2a4b; padding:15px; border-radius:12px; text-align:center; margin-top:8px; cursor:pointer; }
    </style>
</head>
<body>
    <div class="admin-card">
        <div class="header">
            <h1><i class="fas fa-sliders-h"></i> Panel Admin - Keviin</h1>
            <a href="index.html" style="color:#a0a0b0; text-decoration:none; font-size:13px;"><i class="fas fa-globe"></i> Ver sitio live</a>
        </div>

        <form id="adminForm">
            <div class="form-group">
                <label>Nombre Principal:</label>
                <input type="text" id="cfgName" value="Keviin">
            </div>

            <div class="form-group">
                <label>Subtítulo / Rol:</label>
                <input type="text" id="cfgRole" value="SCREENSHARE & COMMUNITY MANAGER">
            </div>

            <div class="form-group">
                <label>Subir Avatar / Logo Directo (PNG/JPG):</label>
                <input type="file" id="fileAvatar" accept="image/*">
                <div class="upload-box" onclick="document.getElementById('fileAvatar').click()">
                    <i class="fas fa-cloud-upload-alt" style="color:#ff2a4b; font-size:20px;"></i>
                    <p style="font-size:12px; color:#c0c0d0; margin-top:4px;">Haz click para seleccionar una imagen desde tu PC</p>
                </div>
            </div>

            <div class="form-group">
                <label>Título de la Canción:</label>
                <input type="text" id="cfgSongTitle" value="After Dark × Sweater Weather">
            </div>

            <div class="form-group">
                <label>Subir Canción MP3 Directa:</label>
                <input type="file" id="fileAudio" accept="audio/mp3,audio/*">
                <div class="upload-box" onclick="document.getElementById('fileAudio').click()">
                    <i class="fas fa-music" style="color:#ff2a4b; font-size:20px;"></i>
                    <p style="font-size:12px; color:#c0c0d0; margin-top:4px;">Haz click para seleccionar tu archivo .mp3 favorito</p>
                </div>
            </div>

            <div class="form-group">
                <label>Usuario de Discord:</label>
                <input type="text" id="cfgDiscord" value="Keviin">
            </div>

            <button type="button" class="btn-save" onclick="saveAdminConfig()"><i class="fas fa-save"></i> Guardar Cambios en la Web</button>
        </form>
    </div>

    <script src="js/admin.js"></script>
</body>
</html>
