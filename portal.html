<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Control - Keviin</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%2308080a'/><text x='50%' y='55%' dominant-baseline='central' text-anchor='middle' fill='%23ff2a4b' font-family='Cinzel, serif' font-weight='bold' font-size='70'>K</text></svg>">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/styles.css">
    <style>
        body { background: #08080a; color: #fff; font-family: 'Outfit', sans-serif; margin: 0; padding: 20px; }
        .admin-container { max-width: 900px; margin: 0 auto; background: #121218; border: 1px solid rgba(255,42,75,0.3); border-radius: 16px; padding: 25px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        .admin-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 15px; margin-bottom: 20px; }
        .admin-title { font-size: 22px; font-weight: 700; color: #ff2a4b; display: flex; align-items: center; gap: 10px; }
        .nav-tabs { display: flex; gap: 10px; margin-bottom: 20px; border-bottom: 1px solid rgba(255,255,255,0.08); padding-bottom: 10px; overflow-x: auto; }
        .tab-btn { background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); color: #ccc; padding: 8px 16px; border-radius: 8px; cursor: pointer; font-size: 14px; transition: 0.2s; white-space: nowrap; }
        .tab-btn.active, .tab-btn:hover { background: #ff2a4b; color: #fff; border-color: #ff2a4b; }
        .tab-pane { display: none; }
        .tab-pane.active { display: block; }
        .form-group { margin-bottom: 18px; }
        .form-group label { display: block; font-size: 13px; color: #a0a0b0; margin-bottom: 6px; font-weight: 600; }
        .form-control { width: 100%; background: #08080a; border: 1px solid rgba(255,255,255,0.15); color: #fff; padding: 10px 14px; border-radius: 8px; box-sizing: border-box; font-family: inherit; font-size: 14px; }
        .form-control:focus { border-color: #ff2a4b; outline: none; }
        .btn-save { background: #ff2a4b; color: #fff; border: none; padding: 12px 24px; border-radius: 8px; font-size: 15px; font-weight: 700; cursor: pointer; transition: 0.2s; width: 100%; margin-top: 15px; }
        .btn-save:hover { background: #e01f3d; box-shadow: 0 0 15px rgba(255,42,75,0.4); }
        .dynamic-item { display: flex; gap: 10px; margin-bottom: 8px; align-items: center; }
        .btn-remove { background: #2a1215; color: #ff4b4b; border: 1px solid #ff4b4b44; padding: 8px 12px; border-radius: 6px; cursor: pointer; }
        .btn-add { background: rgba(255,255,255,0.05); border: 1px dashed rgba(255,255,255,0.2); color: #a0a0b0; width: 100%; padding: 10px; border-radius: 8px; cursor: pointer; font-size: 13px; margin-top: 5px; }
        .btn-add:hover { border-color: #ff2a4b; color: #fff; }
    </style>
</head>
<body>

<div class="admin-container">
    <div class="admin-header">
        <div class="admin-title"><i class="fas fa-sliders-h"></i> Panel de Configuración - Keviin</div>
        <a href="index.html" style="color:#a0a0b0; text-decoration:none; font-size:13px;"><i class="fas fa-external-link-alt"></i> Volver a la Web</a>
    </div>

    <div class="nav-tabs">
        <button class="tab-btn active" onclick="openTab('general', this)"><i class="fas fa-user"></i> General & Dedicatoria</button>
        <button class="tab-btn" onclick="openTab('music', this)"><i class="fas fa-music"></i> Música & Portada</button>
        <button class="tab-btn" onclick="openTab('trajectory', this)"><i class="fas fa-shield-alt"></i> Servidores</button>
        <button class="tab-btn" onclick="openTab('community', this)"><i class="fab fa-discord"></i> Comunidad</button>
    </div>

    <form id="adminForm" onsubmit="event.preventDefault(); saveEverything();">
        <!-- TAB GENERAL -->
        <div class="tab-pane active" id="tab-general">
            <div class="form-group">
                <label><i class="fas fa-heart" style="color:#ff2a4b;"></i> Texto de Dedicatoria (Debajo del Menú)</label>
                <input type="text" id="cfgDedication" class="form-control" placeholder="Ej: Araceli, te amo ♡">
            </div>

            <div class="form-group">
                <label>Nombre Principal</label>
                <input type="text" id="cfgName" class="form-control" placeholder="Keviin">
            </div>

            <div class="form-group">
                <label>Subtítulo / Rol (Badge Redondo)</label>
                <input type="text" id="cfgRole" class="form-control" placeholder="SCREENSHARE & COMMUNITY MANAGER">
            </div>

            <div class="form-group">
                <label>Usuario de Discord</label>
                <input type="text" id="cfgDiscord" class="form-control" placeholder="Keviin">
            </div>

            <div class="form-group">
                <label>Biografía / Descripción Principal</label>
                <textarea id="cfgBio" class="form-control" rows="3" placeholder="Descripción..."></textarea>
            </div>

            <div class="form-group">
                <label>URL Foto de Perfil / Avatar</label>
                <input type="text" id="cfgAvatarUrl" class="form-control" placeholder="https://... o sube una imagen abajo">
                <div style="margin-top:6px;">
                    <input type="file" id="fileAvatarInput" accept="image/*" onchange="showFileName(this, 'avatarFileName')">
                    <span id="avatarFileName" style="font-size:12px; color:#8a8a9e; margin-left:8px;"></span>
                </div>
            </div>

            <div class="form-group">
                <label>Puntos Clave (Checkmarks)</label>
                <div id="bulletsContainer"></div>
                <button type="button" class="btn-add" onclick="addBulletField('')">+ Agregar Punto Clave</button>
            </div>

            <div class="form-group">
                <label>Métricas (Cajas Numeradas)</label>
                <div id="metricsContainer"></div>
                <button type="button" class="btn-add" onclick="addMetricField('', '')">+ Agregar Métrica</button>
            </div>
        </div>

        <!-- TAB MÚSICA -->
        <div class="tab-pane" id="tab-music">
            <div class="form-group">
                <label><i class="fas fa-heading"></i> Nombre de la Canción</label>
                <input type="text" id="cfgSongTitle" class="form-control" placeholder="Ej: Casi que me pierdo">
            </div>

            <div class="form-group">
                <label><i class="fas fa-user-ninja"></i> Nombre del Artista / Grupo</label>
                <input type="text" id="cfgSongArtist" class="form-control" placeholder="Ej: Los Cafres">
            </div>

            <div class="form-group">
                <label><i class="fas fa-link"></i> URL Directa de la Canción (.mp3)</label>
                <input type="text" id="cfgSongUrl" class="form-control" placeholder="https://ejemplo.com/cancion.mp3">
                <span style="font-size:12px; color:#8a8a9e; display:block; margin-top:4px;">Pega el enlace de la canción que quieras colocar. Se actualiza al instante en la web.</span>
            </div>
        </div>

        <!-- TAB SERVIDORES -->
        <div class="tab-pane" id="tab-trajectory">
            <div class="form-group">
                <label>Servidores y Rangos de Trayectoria</label>
                <div id="trajectoryContainer"></div>
                <button type="button" class="btn-add" onclick="addServerField('', '', 'ACTUAL', '')">+ Agregar Servidor</button>
            </div>
        </div>

        <!-- TAB COMUNIDAD -->
        <div class="tab-pane" id="tab-community">
            <div class="form-group">
                <label>Descripción de la Comunidad</label>
                <textarea id="cfgCommDesc" class="form-control" rows="2"></textarea>
            </div>

            <div class="form-group">
                <label>Número de Miembros</label>
                <input type="text" id="cfgCommMembers" class="form-control" placeholder="1,450+">
            </div>

            <div class="form-group">
                <label>Link de Invitación a Discord</label>
                <input type="text" id="cfgCommLink" class="form-control" placeholder="https://discord.gg/...">
            </div>

            <div class="form-group">
                <label>Testimonios de Owners / Managers</label>
                <div id="testimonialsContainer"></div>
                <button type="button" class="btn-add" onclick="addTestimonialField('', '', '')">+ Agregar Testimonio</button>
            </div>

            <div class="form-group">
                <label>Juegos Activos</label>
                <div id="gamesContainer"></div>
                <button type="button" class="btn-add" onclick="addGameField('', 'Activo')">+ Agregar Juego</button>
            </div>
        </div>

        <button type="submit" class="btn-save"><i class="fas fa-save"></i> GUARDAR TODOS LOS CAMBIOS</button>
    </form>
</div>

<script src="js/admin.js"></script>
</body>
</html>
