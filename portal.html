<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Keviin - Panel de Control Completo</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='45' fill='%2308080a'/><circle cx='50' cy='50' r='20' fill='%23ff2a4b'/></svg>">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { margin:0; padding:0; box-sizing:border-box; font-family:'Plus Jakarta Sans', sans-serif; }
        body { background:#08080a; color:#fff; min-height:100vh; padding:30px 20px; display:flex; justify-content:center; }
        .admin-container { width:100%; max-width:900px; background:rgba(18,18,24,0.95); border:1px solid rgba(255,255,255,0.08); border-radius:24px; padding:32px; box-shadow:0 20px 50px rgba(0,0,0,0.6); }
        .header { display:flex; justify-content:space-between; align-items:center; border-bottom:1px solid rgba(255,255,255,0.08); padding-bottom:20px; margin-bottom:25px; }
        .header h1 { font-family:'Outfit', sans-serif; font-size:26px; color:#ff2a4b; font-weight:800; display:flex; align-items:center; gap:12px; }
        .tab-menu { display:flex; gap:10px; margin-bottom:25px; border-bottom:1px solid rgba(255,255,255,0.08); padding-bottom:12px; flex-wrap:wrap; }
        .tab-btn { background:rgba(255,255,255,0.03); border:1px solid rgba(255,255,255,0.08); color:#a0a0b0; padding:10px 18px; border-radius:12px; font-weight:600; font-size:13px; cursor:pointer; transition:0.3s; display:flex; align-items:center; gap:8px; }
        .tab-btn:hover, .tab-btn.active { background:#ff2a4b; color:#fff; border-color:#ff2a4b; box-shadow:0 0 15px rgba(255,42,75,0.4); }
        .tab-content { display:none; }
        .tab-content.active { display:block; }
        .form-group { margin-bottom:20px; }
        label { display:block; font-size:13px; color:#a0a0b0; margin-bottom:8px; font-weight:600; }
        input[type="text"], textarea { width:100%; background:rgba(255,255,255,0.04); border:1px solid rgba(255,255,255,0.1); padding:12px 16px; border-radius:12px; color:#fff; font-size:14px; outline:none; }
        input[type="text"]:focus, textarea:focus { border-color:#ff2a4b; }
        .upload-field { border:1px dashed #ff2a4b; background:rgba(255,42,75,0.05); padding:16px; border-radius:14px; text-align:center; cursor:pointer; transition:0.3s; }
        .upload-field:hover { background:rgba(255,42,75,0.12); }
        .btn-save { background:#ff2a4b; color:#fff; border:none; padding:14px 28px; border-radius:14px; font-weight:700; font-size:14px; cursor:pointer; width:100%; margin-top:20px; box-shadow:0 8px 25px rgba(255,42,75,0.4); transition:0.3s; }
        .btn-save:hover { background:#e01f3f; transform:translateY(-2px); }
    </style>
</head>
<body>
    <div class="admin-container">
        <div class="header">
            <h1><i class="fas fa-sliders-h"></i> Panel de Control - Keviin</h1>
            <a href="index.html" style="color:#a0a0b0; text-decoration:none; font-size:13px; font-weight:600;"><i class="fas fa-globe"></i> Ver sitio live</a>
        </div>

        <div class="tab-menu">
            <button class="tab-btn active" onclick="showTab('general', this)"><i class="fas fa-user"></i> General</button>
            <button class="tab-btn" onclick="showTab('multimedia', this)"><i class="fas fa-music"></i> Multimedia & Archivos</button>
            <button class="tab-btn" onclick="showTab('trayectoria', this)"><i class="fas fa-shield-alt"></i> Trayectoria</button>
            <button class="tab-btn" onclick="showTab('comunidad', this)"><i class="fas fa-users"></i> Comunidad</button>
        </div>

        <form id="fullAdminForm">
            <!-- PESTAÑA GENERAL -->
            <div id="tab-general" class="tab-content active">
                <div class="form-group">
                    <label>Nombre Principal:</label>
                    <input type="text" id="cfgName">
                </div>
                <div class="form-group">
                    <label>Subtítulo / Rol:</label>
                    <input type="text" id="cfgRole">
                </div>
                <div class="form-group">
                    <label>Biografía Resumida:</label>
                    <textarea id="cfgBio" rows="3"></textarea>
                </div>
                <div class="form-group">
                    <label>Usuario de Discord:</label>
                    <input type="text" id="cfgDiscord">
                </div>
            </div>

            <!-- PESTAÑA MULTIMEDIA -->
            <div id="tab-multimedia" class="tab-content">
                <div class="form-group">
                    <label>Título de la Canción:</label>
                    <input type="text" id="cfgSongTitle">
                </div>
                <div class="form-group">
                    <label>URL / Enlace Directo del Audio MP3:</label>
                    <input type="text" id="cfgSongUrl" placeholder="https://... o audio/cancion.mp3">
                </div>
                <div class="form-group">
                    <label>O Seleccionar Archivo MP3 desde la PC:</label>
                    <div class="upload-field" onclick="document.getElementById('fileAudioInput').click()">
                        <i class="fas fa-file-audio" style="font-size:22px; color:#ff2a4b; margin-bottom:6px;"></i>
                        <p style="font-size:12px; color:#c0c0d0;">Haz click para seleccionar una canción .mp3 local</p>
                        <input type="file" id="fileAudioInput" accept="audio/*" style="display:none;" onchange="updateFileName(this, 'audioFileName')">
                        <span id="audioFileName" style="font-size:11px; color:#ff2a4b; display:block; margin-top:4px;"></span>
                    </div>
                </div>
                <div class="form-group">
                    <label>URL / Enlace del Avatar:</label>
                    <input type="text" id="cfgAvatarUrl">
                </div>
                <div class="form-group">
                    <label>O Seleccionar Imagen de Avatar desde la PC:</label>
                    <div class="upload-field" onclick="document.getElementById('fileImgInput').click()">
                        <i class="fas fa-image" style="font-size:22px; color:#ff2a4b; margin-bottom:6px;"></i>
                        <p style="font-size:12px; color:#c0c0d0;">Haz click para seleccionar una imagen (PNG/JPG) local</p>
                        <input type="file" id="fileImgInput" accept="image/*" style="display:none;" onchange="updateFileName(this, 'imgFileName')">
                        <span id="imgFileName" style="font-size:11px; color:#ff2a4b; display:block; margin-top:4px;"></span>
                    </div>
                </div>
            </div>

            <!-- PESTAÑA TRAYECTORIA -->
            <div id="tab-trayectoria" class="tab-content">
                <p style="font-size:13px; color:#8a8a9e; margin-bottom:15px;">Edita la lista de servidores principales en formato JSON o directamente en el campo inferior:</p>
                <div class="form-group">
                    <label>Servidores y Roles (Configuración):</label>
                    <textarea id="cfgTrajectory" rows="8"></textarea>
                </div>
            </div>

            <!-- PESTAÑA COMUNIDAD -->
            <div id="tab-comunidad" class="tab-content">
                <div class="form-group">
                    <label>Descripción de la Comunidad:</label>
                    <input type="text" id="cfgCommunityDesc">
                </div>
                <div class="form-group">
                    <label>Miembros Activos:</label>
                    <input type="text" id="cfgCommunityMembers">
                </div>
                <div class="form-group">
                    <label>Enlace de Invitación de Discord:</label>
                    <input type="text" id="cfgCommunityLink">
                </div>
            </div>

            <button type="button" class="btn-save" onclick="saveFullConfig()"><i class="fas fa-save"></i> Guardar Cambios en la Web</button>
        </form>
    </div>

    <script src="js/admin.js"></script>
</body>
</html>
