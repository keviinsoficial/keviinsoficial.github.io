<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Keviin - Panel de Control</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='45' fill='%2308080a'/><circle cx='50' cy='50' r='20' fill='%23ff2a4b'/></svg>">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { margin:0; padding:0; box-sizing:border-box; font-family:'Plus Jakarta Sans', sans-serif; }
        body { background:#08080a; color:#fff; min-height:100vh; padding:30px 20px; display:flex; justify-content:center; }
        .admin-container { width:100%; max-width:900px; background:rgba(18,18,24,0.95); border:1px solid rgba(255,255,255,0.08); border-radius:24px; padding:32px; box-shadow:0 20px 50px rgba(0,0,0,0.6); }
        .header { display:flex; justify-content:space-between; align-items:center; border-bottom:1px solid rgba(255,255,255,0.08); padding-bottom:20px; margin-bottom:25px; }
        .header h1 { font-family:'Outfit', sans-serif; font-size:26px; color:#ff2a4b; font-weight:800; display:flex; align-items:center; gap:12px; }
        .tab-menu { display:flex; gap:10px; margin-bottom:25px; border-bottom:1px solid rgba(255,255,255,0.08); padding-bottom:12px; flex-wrap:wrap; }
        .tab-btn { background:rgba(255,255,255,0.03); border:1px solid rgba(255,255,255,0.08); color:#a0a0b0; padding:10px 18px; border-radius:12px; font-weight:600; font-size:13px; cursor:pointer; transition:0.3s; display:flex; align-items:center; gap:8px; }
        .tab-btn:hover, .tab-btn.active { background:#ff2a4b; color:#fff; border-color:#ff2a4b; box-shadow:0 0 15px rgba(255,42,75,0.4); }
        .tab-content { display:none; }
        .tab-content.active { display:block; }
        .form-group { margin-bottom:20px; }
        label { display:block; font-size:13px; color:#a0a0b0; margin-bottom:8px; font-weight:600; }
        input[type="text"], textarea { width:100%; background:rgba(255,255,255,0.04); border:1px solid rgba(255,255,255,0.1); padding:12px 16px; border-radius:12px; color:#fff; font-size:14px; outline:none; }
        input[type="text"]:focus, textarea:focus { border-color:#ff2a4b; }
        .upload-field { border:2px dashed #ff2a4b; background:rgba(255,42,75,0.05); padding:20px; border-radius:14px; text-align:center; cursor:pointer; transition:0.3s; margin-top:6px; }
        .upload-field:hover { background:rgba(255,42,75,0.15); transform:scale(1.01); }
        .btn-save { background:#ff2a4b; color:#fff; border:none; padding:16px 28px; border-radius:14px; font-weight:800; font-size:15px; cursor:pointer; width:100%; margin-top:20px; box-shadow:0 8px 25px rgba(255,42,75,0.4); transition:0.3s; letter-spacing:0.5px; }
        .btn-save:hover { background:#e01f3f; transform:translateY(-2px); }
        .btn-reset { background:rgba(255,255,255,0.05); color:#a0a0b0; border:1px solid rgba(255,255,255,0.1); padding:10px 18px; border-radius:12px; font-weight:600; font-size:12px; cursor:pointer; transition:0.3s; margin-top:10px; }
        .btn-reset:hover { background:rgba(255,255,255,0.1); color:#fff; }
    </style>
</head>
<body>
    <div class="admin-container">
        <div class="header">
            <h1><i class="fas fa-sliders-h"></i> Panel Admin - Keviin</h1>
            <a href="index.html" style="color:#a0a0b0; text-decoration:none; font-size:13px; font-weight:600;"><i class="fas fa-globe"></i> Ver sitio live</a>
        </div>

        <div class="tab-menu">
            <button type="button" class="tab-btn active" onclick="switchAdminTab('general', this)"><i class="fas fa-user"></i> General</button>
            <button type="button" class="tab-btn" onclick="switchAdminTab('multimedia', this)"><i class="fas fa-music"></i> Subir Archivos</button>
            <button type="button" class="tab-btn" onclick="switchAdminTab('trayectoria', this)"><i class="fas fa-shield-alt"></i> Trayectoria</button>
            <button type="button" class="tab-btn" onclick="switchAdminTab('comunidad', this)"><i class="fas fa-users"></i> Comunidad</button>
        </div>

        <form id="fullAdminForm" onsubmit="event.preventDefault(); saveFullConfig();">
            <!-- GENERAL -->
            <div id="tab-general" class="tab-content active">
                <div class="form-group">
                    <label>Nombre Principal:</label>
                    <input type="text" id="cfgName" placeholder="Keviin">
                </div>
                <div class="form-group">
                    <label>Subtítulo / Rol:</label>
                    <input type="text" id="cfgRole" placeholder="SCREENSHARE & COMMUNITY MANAGER">
                </div>
                <div class="form-group">
                    <label>Biografía Resumida:</label>
                    <textarea id="cfgBio" rows="3" placeholder="Especialista en seguridad de servidores..."></textarea>
                </div>
                <div class="form-group">
                    <label>Usuario de Discord:</label>
                    <input type="text" id="cfgDiscord" placeholder="Keviin">
                </div>
            </div>

            <!-- MULTIMEDIA & ARCHIVOS -->
            <div id="tab-multimedia" class="tab-content">
                <div class="form-group">
                    <label>Título de la Canción:</label>
                    <input type="text" id="cfgSongTitle" placeholder="After Dark × Sweater Weather">
                </div>
                
                <div class="form-group">
                    <label>1. Subir Canción MP3 Directamente desde tu PC:</label>
                    <div class="upload-field" onclick="document.getElementById('fileAudioInput').click()">
                        <i class="fas fa-file-audio" style="font-size:26px; color:#ff2a4b; margin-bottom:8px;"></i>
                        <p style="font-size:13px; color:#fff; font-weight:700;">Haz click para seleccionar tu canción (.mp3)</p>
                        <span id="audioFileName" style="font-size:12px; color:#ff2a4b; display:block; margin-top:6px; font-weight:700;">Ningún archivo seleccionado</span>
                        <input type="file" id="fileAudioInput" accept="audio/*" style="display:none;" onchange="updateFileName(this, 'audioFileName')">
                    </div>
                </div>

                <div class="form-group">
                    <label>O pegá el enlace/URL directo de la canción (.mp3):</label>
                    <input type="text" id="cfgSongUrl" placeholder="audio/cancion.mp3 o https://...">
                </div>

                <hr style="border:none; border-top:1px solid rgba(255,255,255,0.08); margin:25px 0;">

                <div class="form-group">
                    <label>2. Subir Avatar / Imagen Directamente desde tu PC:</label>
                    <div class="upload-field" onclick="document.getElementById('fileImgInput').click()">
                        <i class="fas fa-image" style="font-size:26px; color:#ff2a4b; margin-bottom:8px;"></i>
                        <p style="font-size:13px; color:#fff; font-weight:700;">Haz click para seleccionar tu foto (PNG/JPG)</p>
                        <span id="imgFileName" style="font-size:12px; color:#ff2a4b; display:block; margin-top:6px; font-weight:700;">Ningún archivo seleccionado</span>
                        <input type="file" id="fileImgInput" accept="image/*" style="display:none;" onchange="updateFileName(this, 'imgFileName')">
                    </div>
                </div>

                <div class="form-group">
                    <label>O pegá el enlace/URL directo de tu foto de perfil:</label>
                    <input type="text" id="cfgAvatarUrl" placeholder="img/avatar.png o https://...">
                </div>
            </div>

            <!-- TRAYECTORIA -->
            <div id="tab-trayectoria" class="tab-content">
                <div class="form-group">
                    <label>Servidores y Roles Configurados (JSON):</label>
                    <textarea id="cfgTrajectory" rows="10"></textarea>
                </div>
            </div>

            <!-- COMUNIDAD -->
            <div id="tab-comunidad" class="tab-content">
                <div class="form-group">
                    <label>Descripción de la Comunidad:</label>
                    <input type="text" id="cfgCommunityDesc">
                </div>
                <div class="form-group">
                    <label>Miembros Activos:</label>
                    <input type="text" id="cfgCommunityMembers">
                </div>
                <div class="form-group">
                    <label>Enlace de Invitación de Discord:</label>
                    <input type="text" id="cfgCommunityLink">
                </div>
            </div>

            <button type="submit" class="btn-save"><i class="fas fa-save"></i> GUARDAR CAMBIOS Y ACTUALIZAR SITIO WEB</button>
            <button type="button" class="btn-reset" onclick="resetDefaults()"><i class="fas fa-undo"></i> Restaurar Valores por Defecto</button>
        </form>
    </div>

    <script src="js/admin.js"></script>
</body>
</html>
